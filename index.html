<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#F3F6FB" />
  <title>Sekolah</title>
  <script>
    // Terapkan tema sebelum halaman digambar (mencegah kedipan): pilihan tersimpan, jika tidak ada ikuti perangkat.
    try {
      var t = localStorage.getItem('tema');
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.tema = t;
    } catch (e) { document.documentElement.dataset.tema = 'light'; }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Serif:wght@500;600&display=swap" />
</head>
<body><div id="app"></div><script type="module" src="/src/main.js"></script></body>
</html>
